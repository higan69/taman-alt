<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>live_stream embed test v2</title></head>
<body>
<h1>live_stream 埋め込み検証 v3（?ch=でチャンネル差し替え可）</h1>
<iframe id="player" width="480" height="270"
  src="https://www.youtube.com/embed/live_stream?channel=UCxsijZ-IubrgLiaY4le_KaA&enablejsapi=1"
  frameborder="0" allowfullscreen></iframe>
<script>
  // ?ch=チャンネルID で対象チャンネルを差し替え可能にする
  (function () {
    var ch = new URLSearchParams(location.search).get('ch');
    if (ch) document.getElementById('player').src = 'https://www.youtube.com/embed/live_stream?channel=' + ch + '&enablejsapi=1';
  })();
</script>
<pre id="log" style="white-space:pre-wrap;font-size:13px"></pre>
<script>
const logEl = document.getElementById('log');
const t0 = Date.now();
function log(msg) { logEl.textContent += '[' + ((Date.now() - t0) / 1000).toFixed(1) + 's] ' + msg + '\n'; }
log('page loaded');
var tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
let player = null;
function onYouTubeIframeAPIReady() {
  log('IFrame API ready');
  player = new YT.Player('player', {
    events: {
      onReady: (e) => {
        log('onReady');
        try { log('videoData: ' + JSON.stringify(e.target.getVideoData())); } catch (err) { log('getVideoData error: ' + err); }
        try { log('videoUrl: ' + e.target.getVideoUrl()); } catch (err) {}
        try { log('duration: ' + e.target.getDuration() + ' state: ' + e.target.getPlayerState()); } catch (err) {}
      },
      onStateChange: (e) => {
        log('onStateChange: ' + e.data);
        try { log('  videoData: ' + JSON.stringify(player.getVideoData())); } catch (err) {}
        try { log('  videoUrl: ' + player.getVideoUrl() + ' duration: ' + player.getDuration()); } catch (err) {}
      },
      onError: (e) => { log('onError: ' + e.data); }
    }
  });
  let n = 0;
  const iv = setInterval(() => {
    n++;
    try {
      log('poll ' + n + ': state=' + player.getPlayerState() + ' duration=' + player.getDuration() + ' url=' + player.getVideoUrl() + ' videoData=' + JSON.stringify(player.getVideoData()));
    } catch (err) { log('poll ' + n + ' error: ' + err); }
    if (n >= 12) { clearInterval(iv); log('DONE'); }
  }, 2500);
}
</script>
</body>
</html>
