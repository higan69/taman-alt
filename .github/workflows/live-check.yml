name: live-check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check FMたまん live status
        run: python3 scripts/check_live.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- live.json; then
            echo "live.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -m "ライブ配信状態を更新"
          git push
