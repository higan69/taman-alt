<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>[非公式]FMたまん 76.3MHz｜番組表</title>
<style>
:root{--blue:#08a8d2;--ink:#242424;--line:#d6dce0;--muted:#68737b;--paper:#f5f7f8}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.5}
header{background:#fff;border-bottom:4px solid var(--blue);padding:22px max(18px,calc((100% - 1100px)/2))}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand-mark{font-size:clamp(30px,6vw,52px);font-weight:900;letter-spacing:-.07em;color:var(--blue);line-height:1}
.brand-mark small{display:block;font-size:12px;letter-spacing:.08em;color:#555}
.freq{font-size:14px;font-weight:700;color:#6e3474}

/* 目立つ公式SNS・リンクバナーセクション */
.official-links-banner{background:linear-gradient(135deg, #f0f9fb 0%, #e6f4f8 100%);border:2px dashed var(--blue);border-radius:12px;padding:14px 18px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.banner-text strong{display:block;font-size:14px;color:#077292}
.banner-text span{font-size:12px;color:var(--muted)}
.sns-links{display:flex;gap:10px;align-items:center}
.sns-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:24px;font-size:14px;font-weight:800;text-decoration:none;color:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.15);transition:transform .2s, opacity .2s}
.sns-btn:hover{transform:translateY(-2px);opacity:.9}
.sns-x{background:#000}
.sns-insta{background:linear-gradient(45deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%)}
.sns-youtube{background:#ff0000}
.sns-btn svg{width:18px;height:18px;fill:currentColor}

h1{font-size:clamp(22px,4vw,32px);margin:18px 0 3px}
.effective{display:inline-block;background:#f4dce8;border:1px solid #b96b8b;padding:3px 12px;font-weight:800;border-radius:3px}
header p{margin:8px 0 0;color:var(--muted);font-size:13px}
main{max-width:1100px;margin:22px auto;padding:0 14px 40px}
.notice{background:#fff7e8;border-left:4px solid #e99b35;padding:10px 13px;margin-bottom:16px;font-size:13px}
.controls{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
button{font:inherit;border:1px solid #b9c4ca;background:#fff;border-radius:7px;padding:9px 13px;cursor:pointer;font-weight:700}
button[aria-pressed=true]{background:#087fa8;color:#fff;border-color:#087fa8}
.day-panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.day-head{padding:16px 18px;background:#f0f8fa;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.day-head h2{font-size:22px;margin:0}.day-head span{font-size:12px;color:var(--muted)}
.programs{padding:4px 16px}
.item{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:14px 8px;border-bottom:1px solid #e8ecee;border-radius:8px;transition:background-color 0.3s ease}
.item:last-child{border-bottom:0}
.time{font-weight:800;color:#087fa8;font-size:16px;font-variant-numeric:tabular-nums}
.name{font-weight:800;font-size:16px}.detail{font-size:13px;color:#59646b;margin-top:3px}
.music{color:#68737b;font-weight:600}

/* 放送中（ON AIR）スロットのスタイル */
.item.is-now-on-air{background:#e6f7ff;border-left:5px solid #08a8d2;box-shadow:0 2px 8px rgba(8, 168, 210, 0.15);padding-left:12px}

/* ON AIR バッジ */
.badge-onair{display:inline-flex;align-items:center;gap:5px;background:#e63946;color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:12px;margin-left:8px;vertical-align:middle;letter-spacing:0.05em}
.badge-onair::before{content:"";display:inline-block;width:6px;height:6px;background-color:#fff;border-radius:50%;animation:pulse 1.2s infinite ease-in-out}

@keyframes pulse{
  0%{opacity:0.3;transform:scale(0.8)}
  50%{opacity:1;transform:scale(1.2)}
  100%{opacity:0.3;transform:scale(0.8)}
}

footer{max-width:1100px;margin:0 auto;padding:0 18px 30px;color:#69747b;font-size:12px}
@media(min-width:760px){.programs{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}.item{align-content:start}}
@media(max-width:420px){.item{grid-template-columns:62px 1fr;gap:8px}.time{font-size:14px}.programs{padding:3px 12px}}
</style>
</head>
